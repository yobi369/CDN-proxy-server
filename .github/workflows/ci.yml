name: CI

on:
  push:
    branches: [main, engineering/adaptive-edge-v2, engineering/http-cache-semantics]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static checks
        run: ruff check --select F cdn_proxy_server.py experiments tests
      - name: Compile source
        run: python -m compileall -q cdn_proxy_server.py experiments tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test synthetic benchmark
        run: python experiments/cache_policy_benchmark.py --requests 1000 --objects 25 --seed 2026
      - name: Smoke-test evolutionary policy search
        run: python experiments/evolutionary_policy_search.py --requests 500 --objects 25 --generations 2 --population 4 --seed 2026
      - name: Validate Docker image build
        run: docker build --tag cdn-proxy-server:test .
      - name: Validate Compose configuration
        env:
          CDN_ALLOWED_HOSTS: example.com
          PROXY_ACCESS_TOKEN: test-access-token
          PROXY_STATS_TOKEN: test-stats-token
        run: docker compose config --quiet
